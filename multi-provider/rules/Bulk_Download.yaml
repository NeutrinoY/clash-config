# 平台域名采用后缀匹配；共享存储仅列具体文件主机。
# Telegram 使用 IP 分类，须以 classical 类型加载此规则集。
payload:
  - DOMAIN-SUFFIX,files.pythonhosted.org # PyPI包文件
  - DOMAIN-SUFFIX,static.rust-lang.org # Rust工具链
  - DOMAIN-SUFFIX,static.crates.io # Rust文件入口
  - DOMAIN-SUFFIX,cloudfront-static.crates.io # Rust文件CDN
  - DOMAIN-SUFFIX,release-assets.githubusercontent.com # GitHub Release
  - DOMAIN-SUFFIX,objects.githubusercontent.com # GitHub对象文件
  - DOMAIN-SUFFIX,codeload.github.com # GitHub源码归档
  - DOMAIN-SUFFIX,production.cloudfront.docker.com # Docker Layer
  - DOMAIN-SUFFIX,production.cloudflare.docker.com # Docker Layer备用CDN
  - DOMAIN-SUFFIX,docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com # Docker专用镜像层存储
  - DOMAIN-SUFFIX,pkg-containers.githubusercontent.com # GHCR实际镜像Blob主机
  - DOMAIN-SUFFIX,googlevideo.com # YouTube视频/音频分段，排在GEOSITE YouTube前
  - DOMAIN-SUFFIX,kiko-play-niptan.one # 个人音频来源（主域及子域）
  - DOMAIN-SUFFIX,proxy.golang.org # Go模块/工具链入口；大文件转向共享storage.googleapis.com后由后续规则处理
  - DOMAIN-SUFFIX,ghcr.io # GHCR仓库入口及Blob流程
  - GEOIP,telegram,no-resolve # 原生Telegram DC IP；按用户要求整类Telegram IP流量走Bulk，不区分聊天/通话/媒体
  - DOMAIN-SUFFIX,userstorage.mega.co.nz # MEGA动态文件传输主机；不覆盖mega.nz/API
  - DOMAIN-SUFFIX,drive.usercontent.google.com # Google Drive专用浏览器文件下载主机；不覆盖通用googleusercontent/GCS
