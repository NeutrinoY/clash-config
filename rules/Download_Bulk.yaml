# 大文件下载：走 📦 大流量下载。mihomo 每小时从 main 拉取，改完推送即可，不用改订阅里的提交号。
# 依据 2026-10-25 的实测：直连不通，或者明显比 Bulk 慢。
payload:
  # GitHub 的文件 CDN（直连单连接 1.6 MB/s、8 线程 5.5，Bulk 22）；ghcr 的镜像层也在这里
  - DOMAIN,release-assets.githubusercontent.com
  - DOMAIN,objects.githubusercontent.com
  - DOMAIN,codeload.github.com
  - DOMAIN,pkg-containers.githubusercontent.com
  # Civitai 小文件（直连 TLS 被掐；大模型在 R2，走直连）
  - DOMAIN,b2.civitai.com
  # PyPI / PyTorch 的大 wheel（cudnn、cublas、torch 动辄几百 MB）。pip 单连接，直连实测 0.3～1.5 MB/s 且抖动大
  - DOMAIN,files.pythonhosted.org
  - DOMAIN,download.pytorch.org
  # NVIDIA 的 CUDA 运行库 wheel（nvidia-*-cu13 之类）
  - DOMAIN,pypi.nvidia.com
  # Codex 命令行的安装包（Cloudflare）。原先命中 openai → ChatGPT → ISP 出口，2026-11-09 实测：ISP 2.2 MB/s；
  # 直连 v4 / v6 都被 Cloudflare 回 403（不给国内 IP 下）；Bulk 两档都在 5.3～5.8（LAX）。公开的包，下载不带登录信息
  - DOMAIN,releases.openai.com
  # Docker Hub 的镜像层（直连不通）。registry-1 / auth 不放：匿名拉取按 IP 计次，Bulk 的 IP 太多人共用
  - DOMAIN,production.cloudflare.docker.com
  - DOMAIN,production.cloudfront.docker.com
