# 大文件下载：直连。mihomo 每小时从 main 拉取，改完推送即可，不用改订阅里的提交号。
# 依据 2026-10-25 的实测：直连能跑满（单连接约 6 MB/s 封顶，8～16 线程和 Bulk 都在 25 MB/s 左右）。
# 只放存文件的 CDN，网页和接口照上游规则走。
payload:
  # Hugging Face：老 LFS CDN、us.aws.cdn.hf.co 这类、Xet（huggingface.co 本身继续走 ISP）
  - DOMAIN-SUFFIX,cdn.hf.co
  - DOMAIN-SUFFIX,xethub.hf.co
  - DOMAIN,cdn-lfs.hf.co
  - DOMAIN,cdn-lfs-us-1.hf.co
  - DOMAIN,cdn-lfs-eu-1.hf.co
  - DOMAIN,cdn-lfs.huggingface.co
  - DOMAIN,cdn-lfs-us-1.huggingface.co
  # Cloudflare R2：Civitai 大模型、Ollama 等，地址里是存储桶和账号 ID
  - DOMAIN-SUFFIX,r2.cloudflarestorage.com
  - DOMAIN-SUFFIX,r2.dev
  # PyTorch 的 wheel 实际在这里（download.pytorch.org 只给索引，再跳转过来），是 R2 的自定义域名，上面两条匹配不到
  - DOMAIN,download-r2.pytorch.org
  # asmr.one 的音频（raw / fast / large）
  - DOMAIN-SUFFIX,kiko-play-niptan.one
  - DOMAIN,download.nvidia.com
  - DOMAIN,developer.download.nvidia.com
  # 驱动、NVIDIA App 的下载（Akamai）。直连时会 301 到官方中国站 international-gfe.download.nvidia.cn（GeoSite cn 本来就直连）。
  # 2026-11-05 实测：原先落到漏网之鱼 → 新加坡v6 2.5 MB/s，直连 6～7.7 MB/s
  - DOMAIN,international-gfe.download.nvidia.com
  # LM Studio 无界面服务端 llmster 的安装包（Cloudflare）。原先命中 category-ai-!cn → AI服务 → ISP 出口，约 0.4 MB/s 还挤占 Claude
  - DOMAIN,llmster.lmstudio.ai
  # Codex App 的安装包和运行时更新（每次约 500MB，Cloudflare，没有国内节点）。原先命中 openai → ChatGPT → ISP 出口，
  # 2026-11-05 实测：走 ISP 2.3 MB/s（BOS），直连 6.6 MB/s（HKG，v4、v6 一样）。只放这一个域名，ChatGPT 的其余域名照旧走 ISP
  - DOMAIN,persistent.oaistatic.com
  # uv 下载的 Python（python-build-standalone 的镜像，Cloudflare）。原先落到漏网之鱼 → Premium，
  # 2026-11-09 实测：Premium 2.4 MB/s，直连 v4 / v6 都在 5.6～5.8（HKG）
  - DOMAIN,releases.astral.sh
  # Google Cloud Storage 上的公开文件（Chrome for Testing 之类）。原先命中谷歌服务 → Premium，
  # 2026-11-09 实测：Premium 2.4 MB/s，直连 v6 5.4～6.0，v4 一次 1.9、一次 5.4
  - DOMAIN,storage.googleapis.com
  # Ubuntu 官方源（jp.archive 之类的国家镜像、security）。2026-10-30 落到漏网之鱼 → 新加坡v6，约 1.2 MB/s 且偶发连接失败
  - DOMAIN-SUFFIX,archive.ubuntu.com
  - DOMAIN,security.ubuntu.com
  # 开发依赖（都有 v6）。pythonhosted 和 pytorch 的大 wheel 在 Download_Bulk
  - DOMAIN,registry.npmjs.org
  - DOMAIN,nodejs.org
  - DOMAIN,static.rust-lang.org
  - DOMAIN,static.crates.io
  - DOMAIN,index.crates.io
